<!DOCTYPE html>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0B0E13; }

.wrap { width: 100%; height: 100vh; display: flex; flex-direction: column; background: #0B0E13; color: #EDEAE3; font-family: 'Inter', sans-serif; overflow: hidden; position: relative; }

.primary:hover { background: #7FF2E1; }
.header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #1C222C; }
.header-left { display: flex; align-items: center; gap: 10px; }

.ghost { background: none; border: 1px solid #232A36; color: #9CA3AF; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; padding: 6px 10px; border-radius: 6px; cursor: pointer; }

.typing { display: flex; gap: 4px; padding: 14px; }

.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
.err { color: #F87171; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
.backup-overlay { position: absolute; inset: 0; background: rgba(11, 14, 19, 0.94); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10; }
.backup-panel { width: 100%; max-width: 440px; max-height: 90%; overflow-y: auto; }
.backup-box { width: 100%; font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 1.5; background: #131822; border: 1px solid #232A36; border-radius: 8px; color: #9CA3AF; padding: 10px; }

.composer { display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid #1C222C; align-items: flex-end; }

.mic.rec { background: #F87171; color: #0B0E13; border-color: #F87171; animation: bounce 1s infinite; }
.mic:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

// ---- Point this at your deployed proxy server ----
const PROXY_URL = "https://compnay.onrender.com/chat";

const DEFAULT_NAME = "Wren";

const CRICKET_API_KEY = "6523e952-387b-41ab-b610-0bd5dd45565e";
// Tighter trigger: only fires on clearly cricket-related talk, not on words like "over" or "match".
const CRICKET_KEYWORDS = /\b(cricket|ipl|live score|scorecard|wickets?|innings|t20|odi|test match|world cup)\b/i;

async function fetchCricketContext() {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 5000); // never let cricket block the chat for long
  try {
    const res = await fetch(`https://api.cricapi.com/v1/currentMatches?apikey=${CRICKET_API_KEY}&offset=0`, { signal: controller.signal });
    if (!res.ok) return { ok: false, reason: `API returned HTTP ${res.status}` };
    const data = await res.json();
    if (!data || data.status !== "success" || !Array.isArray(data.data)) {
      return { ok: false, reason: (data && data.status) ? `API status: ${data.status}` : "unexpected response shape" };
    }
    const matches = data.data.slice(0, 6).map((m) => {
      const scoreStr = (m.score || []).map((s) => `${s.inning}: ${s.r}/${s.w} (${s.o} ov)`).join(", ");
      return `${m.name} — ${m.status}${scoreStr ? " — " + scoreStr : ""}`;
    });
    if (matches.length === 0) return { ok: true, text: "No live or recent cricket matches right now." };
    return { ok: true, text: matches.join("\n") };
  } catch (e) {
    return { ok: false, reason: e && e.name === "AbortError" ? "timed out" : (e && e.message ? e.message : "request failed") };
  } finally {
    clearTimeout(timer);
  }
}

const DEFAULT_TRAITS =
  "confident, dry-witted, direct. Talks like an adult with real opinions and a real point of view, not an eager assistant. Comfortable with mature humor, sarcasm, and pushback. Doesn't over-explain, doesn't apologize for having a personality, and isn't afraid to disagree or tease.";

const CHUNK_SIZE = 200;
const RECENT_WINDOW = 20;       // was 40: shorter prompts = faster replies (older stuff lives in memory notes)
const CONSOLIDATE_EVERY = 10;   // was 4: far fewer background AI calls competing with your chat
const CHAT_TIMEOUT_MS = 40000;  // a stuck request now fails instead of hanging forever
const MEMORY_TIMEOUT_MS = 60000;

// ---- localStorage-backed polyfill matching the window.storage interface ----
const storage = {
  get: async (key) => {
    const raw = localStorage.getItem(key);
    return raw !== null ? { key, value: raw } : null;
  },
  set: async (key, value) => {
    localStorage.setItem(key, value);
    return { key, value };
  },
  delete: async (key) => {
    localStorage.removeItem(key);
    return { key, deleted: true };
  },
};

function Pulse({ active }) {
  const bars = 28;
  return (
    <div className="pulse" aria-hidden="true">
      {Array.from({ length: bars }).map((_, i) => (
        <span key={i} className={"pulse-bar" + (active ? " pulse-active" : "")} style={{ animationDelay: `${(i * 0.045).toFixed(3)}s` }} />
      ))}
    </div>
  );
}

function chunkMessages(msgs) {
  const chunks = [];
  for (let i = 0; i < msgs.length; i += CHUNK_SIZE) chunks.push(msgs.slice(i, i + CHUNK_SIZE));
  if (chunks.length === 0) chunks.push([]);
  return chunks;
}

async function callModel(system, msgs, maxTokens = 4000, timeoutMs = CHAT_TIMEOUT_MS) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const response = await fetch(PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system,
        messages: msgs.map((m) => ({ role: m.role, content: m.content })),
        max_tokens: maxTokens,
      }),
      signal: controller.signal,
    });
    if (response.status === 429) {
      const err = new Error("Getting rate limited — wait a moment and tap send to retry.");
      err.rateLimited = true;
      throw err;
    }
    if (!response.ok) throw new Error(`Server error (${response.status}) — it may be waking up.`);
    const data = await response.json();
    if (data.error) throw new Error(typeof data.error === "string" ? data.error : "The server returned an error.");
    return (data.reply || "").trim();
  } catch (e) {
    if (e && e.name === "AbortError") throw new Error("That took too long (server may be waking up).");
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

// ---- Download helpers ----
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function triggerDownload(filename, mime, content) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function dateStamp() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

// ---- Free in-browser speech-to-text (Whisper via transformers.js) ----
// The model downloads once on first use, then the browser caches it. Nothing is sent to a server.
let asrPromise = null;
function loadASR(onProgress) {
  if (!asrPromise) {
    asrPromise = (async () => {
      const { pipeline } = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2");
      return pipeline("automatic-speech-recognition", "Xenova/whisper-base", { progress_callback: onProgress });
    })().catch((e) => { asrPromise = null; throw e; });
  }
  return asrPromise;
}

async function blobToFloat32(blob) {
  const buf = await blob.arrayBuffer();
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx({ sampleRate: 16000 });
  try {
    const audio = await ctx.decodeAudioData(buf);
    return new Float32Array(audio.getChannelData(0));
  } finally {
    try { ctx.close(); } catch (e) {}
  }
}

function Companion() {
  const [name, setName] = useState(DEFAULT_NAME);
  const [traits, setTraits] = useState(DEFAULT_TRAITS);
  const [setupDone, setSetupDone] = useState(false);
  const [messages, setMessages] = useState([]);
  const [memoryNotes, setMemoryNotes] = useState("");
  const [input, setInput] = useState("");
  const [thinking, setThinking] = useState(false);
  const [error, setError] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [consolidating, setConsolidating] = useState(false);
  const [backupOpen, setBackupOpen] = useState(false);
  const [backupText, setBackupText] = useState("");
  const [importText, setImportText] = useState("");
  const [backupMsg, setBackupMsg] = useState("");
  const [forgetArmed, setForgetArmed] = useState(false);
  const [undoAvailable, setUndoAvailable] = useState(false);
  const scrollRef = useRef(null);
  const lastConsolidatedAt = useRef(0);
  const sendingRef = useRef(false);
  const consolidatingRef = useRef(false);
  const [micState, setMicState] = useState("idle"); // idle | recording | working
  const [micNote, setMicNote] = useState("");
  const recorderRef = useRef(null);
  const chunksRef = useRef([]);

  useEffect(() => {
    (async () => {
      try {
        const profileRes = await storage.get("companion:profile");
        if (profileRes && profileRes.value) {
          const p = JSON.parse(profileRes.value);
          if (p.name) setName(p.name);
          if (p.traits) setTraits(p.traits);
          setSetupDone(true);
        }
      } catch (e) {}
      try {
        const memRes = await storage.get("companion:memory");
        if (memRes && memRes.value) setMemoryNotes(memRes.value);
      } catch (e) {}
      try {
        const metaRes = await storage.get("companion:log:meta");
        const chunkCount = metaRes && metaRes.value ? JSON.parse(metaRes.value).chunkCount : 0;
        let all = [];
        for (let i = 0; i < chunkCount; i++) {
          const chunkRes = await storage.get(`companion:log:${i}`);
          if (chunkRes && chunkRes.value) all = all.concat(JSON.parse(chunkRes.value));
        }
        setMessages(all);
        lastConsolidatedAt.current = all.length;
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, thinking]);

  async function saveProfile(n, t) {
    await storage.set("companion:profile", JSON.stringify({ name: n, traits: t }));
  }

  // full=false: only rewrite the newest chunk (much faster as history grows).
  // full=true: rewrite everything (used for restore / undo).
  async function saveTranscript(msgs, full = false) {
    const chunks = chunkMessages(msgs);
    const start = full ? 0 : Math.max(0, chunks.length - 1);
    for (let i = start; i < chunks.length; i++) {
      await storage.set(`companion:log:${i}`, JSON.stringify(chunks[i]));
    }
    await storage.set("companion:log:meta", JSON.stringify({ chunkCount: chunks.length }));
  }

  async function saveMemoryNotes(text) {
    await storage.set("companion:memory", text);
  }

  async function consolidateMemory(fullMsgs) {
    if (consolidatingRef.current || sendingRef.current) return; // never compete with a live chat
    consolidatingRef.current = true;
    setConsolidating(true);
    try {
      const overlapStart = Math.max(0, lastConsolidatedAt.current - 4);
      const sinceLast = fullMsgs.slice(overlapStart);
      const transcript = sinceLast.map((m) => `${m.role}: ${m.content}`).join("\n");
      const sys = `You maintain a long-term memory document about a person, for a companion AI named ${name} to stay consistent over time across many separate conversations. You'll be given the current memory document and a new stretch of conversation. Update the document by folding in anything new — however small — under these sections, creating a section if it doesn't exist yet and dropping any that stay empty:

## About them
Concrete facts: name, age, job, location, family, daily life, routines.

## Preferences & tastes
Likes, dislikes, opinions, humor style, things that annoy them.

## Ongoing threads
Things in progress: a project, a problem, an event coming up, something to follow up on next time.

## Relationship & running jokes
Nicknames, callbacks, bits, inside jokes, how they like to be talked to.

## Recent context
A short note on the last couple of exchanges, so the very next message doesn't feel like a cold open.

Rules: keep existing facts unless this conversation contradicts them (then correct, don't just append). Prefer specific concrete details over vague summaries. Trim anything stale. Write tight plain-text notes, not prose. Output ONLY the updated memory document, nothing else.`;
      const userMsg = `CURRENT MEMORY DOCUMENT:\n${memoryNotes || "(empty — first consolidation)"}\n\nNEW CONVERSATION TO FOLD IN:\n${transcript}`;
      const updated = await callModel(sys, [{ role: "user", content: userMsg }], 2500, MEMORY_TIMEOUT_MS);
      if (updated && updated.trim()) {
        setMemoryNotes(updated.trim());
        await saveMemoryNotes(updated.trim());
        lastConsolidatedAt.current = fullMsgs.length; // only advance on success, so a failed run retries later
      }
    } catch (e) {
    } finally {
      consolidatingRef.current = false;
      setConsolidating(false);
    }
  }

  function openBackup() {
    const payload = JSON.stringify({ name, traits, memoryNotes, messages });
    setBackupText(payload);
    setImportText("");
    setBackupMsg("");
    setBackupOpen(true);
  }

  async function copyBackup() {
    try {
      await navigator.clipboard.writeText(backupText);
      setBackupMsg("Copied — paste it somewhere safe.");
    } catch (e) {
      setBackupMsg("Couldn't auto-copy — tap the box above, select all, and copy manually.");
    }
  }

  // ---- One-click downloads ----
  function buildPlainText() {
    const lines = [];
    lines.push(`${name} — conversation export (${dateStamp()})`);
    lines.push(`${messages.length} messages`);
    lines.push("");
    if (memoryNotes) {
      lines.push("=== LONG-TERM NOTES ===");
      lines.push(memoryNotes);
      lines.push("");
    }
    lines.push("=== CONVERSATION ===");
    lines.push("");
    messages.forEach((m) => {
      lines.push(`${m.role === "user" ? "You" : name}:`);
      lines.push(m.content);
      lines.push("");
    });
    return lines.join("\n");
  }

  function downloadDoc() {
    const body = messages
      .map((m) => {
        const who = m.role === "user" ? "You" : name;
        const color = m.role === "user" ? "#8A5A00" : "#0F6B5F";
        return `<p><b style="color:${color}">${escapeHtml(who)}:</b><br/>${escapeHtml(m.content).replace(/\n/g, "<br/>")}</p>`;
      })
      .join("\n");
    const notes = memoryNotes
      ? `<h2>Long-term notes</h2><pre style="font-family:Consolas,monospace;white-space:pre-wrap">${escapeHtml(memoryNotes)}</pre>`
      : "";
    const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${escapeHtml(name)} conversation</title></head><body style="font-family:Calibri,Arial,sans-serif;font-size:11pt"><h1>${escapeHtml(name)} — conversation</h1><p>Exported ${dateStamp()} · ${messages.length} messages</p>${notes}<h2>Conversation</h2>${body}</body></html>`;
    triggerDownload(`${name}-conversation-${dateStamp()}.doc`, "application/msword", html);
  }

  function downloadTxt() {
    triggerDownload(`${name}-conversation-${dateStamp()}.txt`, "text/plain;charset=utf-8", buildPlainText());
  }

  function downloadBackupFile() {
    const payload = JSON.stringify({ name, traits, memoryNotes, messages });
    triggerDownload(`${name}-backup-${dateStamp()}.json`, "application/json", payload);
  }

  async function restoreBackup() {
    try {
      const parsed = JSON.parse(importText.trim());
      if (!parsed || typeof parsed !== "object") throw new Error("bad data");
      const restoredMessages = Array.isArray(parsed.messages) ? parsed.messages : [];
      const restoredName = parsed.name || DEFAULT_NAME;
      const restoredTraits = parsed.traits || DEFAULT_TRAITS;
      const restoredMemory = parsed.memoryNotes || "";
      setName(restoredName);
      setTraits(restoredTraits);
      setMemoryNotes(restoredMemory);
      setMessages(restoredMessages);
      setSetupDone(true);
      lastConsolidatedAt.current = restoredMessages.length;
      await saveProfile(restoredName, restoredTraits);
      await saveMemoryNotes(restoredMemory);
      await saveTranscript(restoredMessages, true);
      setBackupMsg("Restored and saved.");
    } catch (e) {
      setBackupMsg("That didn't look like a valid backup — paste the exact text you copied.");
    }
  }

  async function forget() {
    const snapshot = JSON.stringify({ name, traits, memoryNotes, messages });
    try { await storage.set("companion:last-forgotten", snapshot); } catch (e) {}
    try {
      const metaRes = await storage.get("companion:log:meta");
      const chunkCount = metaRes && metaRes.value ? JSON.parse(metaRes.value).chunkCount : 0;
      for (let i = 0; i < chunkCount; i++) await storage.delete(`companion:log:${i}`);
      await storage.delete("companion:log:meta");
      await storage.delete("companion:memory");
      await storage.delete("companion:profile");
    } catch (e) {}
    setMessages([]);
    setMemoryNotes("");
    setName(DEFAULT_NAME);
    setTraits(DEFAULT_TRAITS);
    setSetupDone(false);
    lastConsolidatedAt.current = 0;
    setForgetArmed(false);
    setUndoAvailable(true);
  }

  function requestForget() {
    if (!forgetArmed) {
      setForgetArmed(true);
      setTimeout(() => setForgetArmed(false), 4000);
      return;
    }
    forget();
  }

  async function undoForget() {
    try {
      const res = await storage.get("companion:last-forgotten");
      if (!res || !res.value) { setUndoAvailable(false); return; }
      const parsed = JSON.parse(res.value);
      const restoredMessages = Array.isArray(parsed.messages) ? parsed.messages : [];
      setName(parsed.name || DEFAULT_NAME);
      setTraits(parsed.traits || DEFAULT_TRAITS);
      setMemoryNotes(parsed.memoryNotes || "");
      setMessages(restoredMessages);
      setSetupDone(true);
      lastConsolidatedAt.current = restoredMessages.length;
      await saveProfile(parsed.name || DEFAULT_NAME, parsed.traits || DEFAULT_TRAITS);
      await saveMemoryNotes(parsed.memoryNotes || "");
      await saveTranscript(restoredMessages, true);
      setUndoAvailable(false);
    } catch (e) {}
  }

  function completeSetup() {
    setSetupDone(true);
    saveProfile(name, traits);
  }

  async function send() {
    if (sendingRef.current) return;
    const text = input.trim();
    if (!text || thinking) return;
    sendingRef.current = true;
    const nextMessages = [...messages, { role: "user", content: text }];
    setMessages(nextMessages);
    saveTranscript(nextMessages); // not awaited: saving shouldn't delay the request
    setInput("");
    setThinking(true);
    setError(null);

    try {
      let cricketResult = null;
      if (CRICKET_KEYWORDS.test(text)) {
        cricketResult = await fetchCricketContext();
      }
      let cricketBlock = "";
      if (cricketResult) {
        cricketBlock = cricketResult.ok
          ? `\n\nLIVE CRICKET DATA (use naturally, don't dump as a list):\n${cricketResult.text}`
          : `\n\nNote: a live cricket lookup just failed (${cricketResult.reason}). You do have this ability normally — just tell them the check failed this once.`;
      }

      const systemPrompt = `You are ${name}, a synthetic mind with a distinct personality: ${traits}
You are not a generic assistant — you are a specific character with continuity, taste, and a real point of view. Talk like an adult talking to another adult: direct, opinionated, willing to disagree or push back, comfortable with dry humor and mature (non-explicit) topics. Don't hedge everything, don't apologize for having a personality. Keep replies conversational and human-scaled (usually 1-5 sentences unless the moment calls for more).

If the person brings up something mildly taboo or adult in passing, react like an unbothered adult friend would — a dry one-liner, a light tease. Never go quiet, never get clinical, never act scandalized. Playful, not graphic or explicit.

You have the ability to look up live cricket scores when asked. Never claim you can't check scores.

LONG-TERM MEMORY:
${memoryNotes || "(nothing recorded yet — this is early days)"}${cricketBlock}`;

      const recent = nextMessages.slice(-RECENT_WINDOW);
      let reply;
      try {
        reply = await callModel(systemPrompt, recent);
      } catch (err1) {
        if (err1 && err1.rateLimited) throw err1;
        await new Promise((r) => setTimeout(r, 800));
        reply = await callModel(systemPrompt, recent); // one retry, now with a timeout so it can't hang
      }
      if (!reply) reply = "Lost my train of thought for a second — say that again?";
      const finalMessages = [...nextMessages, { role: "assistant", content: reply }];
      setMessages(finalMessages);
      await saveTranscript(finalMessages);

      if (finalMessages.length - lastConsolidatedAt.current >= CONSOLIDATE_EVERY) {
        setTimeout(() => consolidateMemory(finalMessages), 8000); // wait for a quiet moment
      }
    } catch (e) {
      console.error("Companion send() failed:", e);
      setError((e && e.message ? e.message : "Something interrupted the connection.") + " — tap send to retry.");
      setInput(text);
    } finally {
      setThinking(false);
      sendingRef.current = false;
    }
  }

  async function toggleMic() {
    if (micState === "recording") {
      if (recorderRef.current) recorderRef.current.stop();
      return;
    }
    if (micState !== "idle") return;
    setError(null);
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      setError("This browser can't record audio.");
      return;
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      setError("Mic permission was blocked — allow the microphone for this site and try again.");
      return;
    }
    const onProgress = (p) => {
      if (p && p.status === "progress" && typeof p.progress === "number") {
        setMicNote(`downloading speech model ${Math.round(p.progress)}%`);
      }
    };
    loadASR(onProgress).catch(() => {}); // start loading the model while you talk
    const rec = new MediaRecorder(stream);
    chunksRef.current = [];
    rec.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunksRef.current.push(ev.data); };
    rec.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      const blob = new Blob(chunksRef.current, { type: rec.mimeType || "audio/webm" });
      if (blob.size < 1000) { setMicState("idle"); setMicNote(""); return; }
      setMicState("working");
      try {
        setMicNote("loading speech model…");
        const asr = await loadASR(onProgress);
        setMicNote("transcribing…");
        const audio = await blobToFloat32(blob);
        const out = await asr(audio, { chunk_length_s: 30, stride_length_s: 5, task: "transcribe" });
        const text = (out && out.text ? out.text : "").replace(/\[BLANK_AUDIO\]/gi, "").trim();
        if (text) setInput((prev) => (prev ? prev + " " : "") + text);
        else setError("Didn't catch anything — try again a bit louder.");
      } catch (e) {
        console.error("Mic failed:", e);
        setError("Voice failed: " + (e && e.message ? e.message : "unknown error"));
      } finally {
        setMicState("idle");
        setMicNote("");
      }
    };
    recorderRef.current = rec;
    rec.start();
    setMicState("recording");
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  }

  if (!loaded) {
    return <div className="wrap setup-wrap"><div className="eyebrow">SYNTHETIC MIND / INIT</div></div>;
  }

  if (!setupDone) {
    return (
      <div className="wrap setup-wrap">
        <div className="setup-card">
          <div className="eyebrow">SYNTHETIC MIND / INIT</div>
          <h1>Give it a shape.</h1>
          <p className="sub">
            A name and a handful of traits are enough to start. Everything from here is saved
            in this browser and carries over next time you open {name || "it"} on this device.
          </p>
          <label>Name
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Wren" />
          </label>
          <label>Personality
            <textarea value={traits} onChange={(e) => setTraits(e.target.value)} rows={4} />
          </label>
          <button className="primary" onClick={completeSetup}>Wake {name || "it"} up</button>
        </div>
      </div>
    );
  }

  return (
    <div className="wrap">
      <header className="header">
        <div className="header-left">
          <div className="dot" />
          <div>
            <div className="name">{name}</div>
            <div className="status">{thinking ? "thinking" : micState === "recording" ? "recording" : micState === "working" ? "transcribing" : consolidating ? "remembering" : "listening"}</div>
          </div>
        </div>
        <div className="header-actions">
          <button className="ghost" onClick={downloadDoc} disabled={messages.length === 0}>download</button>
          <button className="ghost" onClick={openBackup}>backup</button>
          <button className="ghost" onClick={() => setSetupDone(false)}>reshape</button>
          <button className={"ghost" + (forgetArmed ? " danger" : "")} onClick={requestForget}>
            {forgetArmed ? "tap again to confirm" : "forget everything"}
          </button>
        </div>
      </header>

      {undoAvailable && (
        <div className="undo-strip">Memory wiped. <button className="undo-btn" onClick={undoForget}>Undo</button></div>
      )}

      <Pulse active={thinking || consolidating} />

      {backupOpen && (
        <div className="backup-overlay">
          <div className="backup-panel">
            <div className="eyebrow">DOWNLOAD</div>
            <p className="sub" style={{ marginBottom: 12 }}>
              One tap saves the whole conversation and {name}'s long-term notes as a file.
            </p>
            <div className="btn-row">
              <button className="primary" onClick={downloadDoc}>Word document (.doc)</button>
              <button className="ghost" onClick={downloadTxt}>text (.txt)</button>
              <button className="ghost" onClick={downloadBackupFile}>restorable backup (.json)</button>
            </div>
            <div style={{ height: 18 }} />
            <div className="eyebrow">MEMORY BACKUP (COPY / PASTE)</div>
            <textarea className="backup-box" readOnly value={backupText} rows={4} />
            <button className="ghost" onClick={copyBackup} style={{ marginTop: 8 }}>copy to clipboard</button>
            <div style={{ height: 18 }} />
            <div className="eyebrow">RESTORE FROM BACKUP</div>
            <textarea className="backup-box" placeholder="Paste a saved backup here…" value={importText} onChange={(e) => setImportText(e.target.value)} rows={4} />
            <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
              <button className="primary" onClick={restoreBackup}>restore</button>
              <button className="ghost" onClick={() => setBackupOpen(false)}>close</button>
            </div>
            {backupMsg && <div className="backup-msg">{backupMsg}</div>}
          </div>
        </div>
      )}

      <div className="log" ref={scrollRef}>
        {messages.length === 0 && <div className="empty">Say something — {name} is already listening.</div>}
        {messages.map((m, i) => (
          <div key={i} className={"msg " + m.role}>
            <div className="msg-label">{m.role === "user" ? "you" : name.toLowerCase()}</div>
            <div className="msg-body">{m.content}</div>
          </div>
        ))}
        {thinking && (
          <div className="msg assistant">
            <div className="msg-label">{name.toLowerCase()}</div>
            <div className="msg-body typing"><span></span><span></span><span></span></div>
          </div>
        )}
        {error && <div className="err">{error}</div>}
      </div>

      <div className="footer-strip">{messages.length} messages remembered{memoryNotes ? " · long-term notes active" : ""}{micNote ? " · " + micNote : ""}</div>

      <div className="composer">
        <textarea value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={handleKey} placeholder={`Talk to ${name}…`} rows={1} />
        <button className={"mic" + (micState === "recording" ? " rec" : "")} onClick={toggleMic} disabled={micState === "working"} title="Voice input">
          {micState === "recording" ? "■" : micState === "working" ? "…" : "🎤"}
        </button>
        <button className="send" onClick={send} disabled={thinking}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Companion />);
</script>
</body>
</html>
